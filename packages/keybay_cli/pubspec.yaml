name: keybay_cli
description: Austere, local secret injection backed by Keybay.
version: 0.2.0
# Ships only as native binaries (GitHub Release, Homebrew), never to pub.dev.
publish_to: none
repository: https://github.com/danReynolds/keybay/tree/main/packages/keybay_cli
homepage: https://danreynolds.github.io/keybay/#cli

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  characters: 1.4.1
  ffi: 2.2.0
  fleury:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: 1f967547915ce0ae7be717cf677e803e958ece5b
      path: packages/fleury
  fleury_widgets:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: 1f967547915ce0ae7be717cf677e803e958ece5b
      path: packages/fleury_widgets
  keybay: 0.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  keybay: keybay

keybay:
  application_id: keybay-cli
