# Workspace root — not a published package. It exists only to give the two
# Keybay packages a single, shared dependency resolution (one pubspec.lock).
# The packages publish independently from their own directories:
#   packages/keybay      → the core library (pub.dev: keybay)
#   packages/keybay_cli  → the CLI (Homebrew, GitHub release; not pub.dev)
name: keybay_workspace
publish_to: none

environment:
  sdk: ^3.11.0

dev_dependencies:
  crypto: ^3.0.7
  fleury_web:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: 1f967547915ce0ae7be717cf677e803e958ece5b
      path: packages/fleury_web
  html: ^0.15.6
  keybay_cli: 0.2.0
  test: ^1.25.0
  web: 1.1.1

workspace:
  - packages/keybay
  - packages/keybay_cli

# Active development only: fleury_widgets declares its dependency on fleury
# from the hosted registry, which pub will not unify with the git commit the
# CLI pins. The override points at that exact same commit — it substitutes the
# source, never the code — and dependency_closure_test asserts the two refs
# match. Remove it once a hosted Fleury release exists.
dependency_overrides:
  fleury:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: 1f967547915ce0ae7be717cf677e803e958ece5b
      path: packages/fleury
