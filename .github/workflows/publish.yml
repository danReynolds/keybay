name: publish keybay core

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

env:
  RELEASE_TAG_SIGNER: 'SHA256:4ozSnfVaMzZ/qrzo51I8FPKawmZSIojAB5Ll+qhguFM'

concurrency:
  group: keybay-core-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.12.2
      - name: verify the signed core tag and reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_release_tag_signature() {
            local label="$1" tag_json="$2"
            local payload="$RUNNER_TEMP/$label.payload"
            local signature="$RUNNER_TEMP/$label.signature"
            local proof
            jq -j .verification.payload <<<"$tag_json" > "$payload"
            jq -j .verification.signature <<<"$tag_json" > "$signature"
            proof="$(ssh-keygen -Y check-novalidate -n git \
              -s "$signature" < "$payload" 2>&1)"
            rm -f "$payload" "$signature"
            test "$proof" = "Good \"git\" signature with ED25519 key $RELEASE_TAG_SIGNER"
            printf '%s\n' "$proof"
          }

          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          package_version="$(awk '$1 == "version:" { print $2 }' packages/keybay/pubspec.yaml)"
          test "$version" = "$package_version"

          previous_versions="$(
            git tag --list 'v*' |
              sed -n 's/^v\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' |
              grep -vxF "$version" || true
          )"
          if [[ -n "$previous_versions" ]]; then
            previous_latest="$(printf '%s\n' "$previous_versions" | sort -V | tail -1)"
            newest="$(printf '%s\n%s\n' "$previous_latest" "$version" | sort -V | tail -1)"
            if [[ "$newest" != "$version" ]]; then
              echo "refusing core version $version after release tag v$previous_latest" >&2
              exit 1
            fi
          fi

          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(jq -r .object.type <<<"$ref_json")" = tag
          tag_object="$(jq -r .object.sha <<<"$ref_json")"
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          test "$(jq -r .verification.verified <<<"$tag_json")" = true
          verify_release_tag_signature core "$tag_json"
          test "$(jq -r .object.type <<<"$tag_json")" = commit
          tag_commit="$(jq -r .object.sha <<<"$tag_json")"
          test "$tag_commit" = "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_REF_NAME^{}")" = "$tag_commit"

          git fetch --no-tags origin main
          test "$tag_commit" = "$(git rev-parse origin/main)"
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test -x integration
        working-directory: packages/keybay
      - run: ./tool/validate_publish.sh packages/keybay cryptography ffi
      - name: build and validate the exact core assurance subject
        run: ./tool/build_core_assurance.sh build/core-assurance "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-assurance
          path: build/core-assurance/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.12.2
      - run: dart pub get --enforce-lockfile
        working-directory: packages/keybay
      - name: publish or reconcile the exact pub.dev archive through OIDC
        run: ./tool/publish_pubdev.sh packages/keybay

  attest-assurance:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: core-assurance
          path: assurance
      - name: bind the canonical package-content subject
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          identity="assurance/keybay-$version.canonical-content"
          test -f "$identity"
          (cd assurance && sha256sum "keybay-$version.canonical-content" > subject.checksums.txt)
      - name: attest the release assurance manifest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: assurance/subject.checksums.txt
          predicate-type: https://keybay.dev/attestations/release-assurance/v1
          predicate-path: assurance/release-assurance.json
      - name: verify hosted package identity and public assurance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The public verification path is the exact script a consumer runs
          # (SECURITY.md). CI adds two checks a consumer cannot: the hosted
          # archive matches the bytes this run built, and the verified
          # predicate equals the manifest this run attested.
          workdir="$RUNNER_TEMP/verify"
          ./tool/verify_release.sh keybay "$version" \
            --source-ref "$GITHUB_REF" \
            --work-dir "$workdir" \
            --output-predicate "$RUNNER_TEMP/actual-predicate.json"
          python3 tool/compare_pub_archives.py \
            "assurance/keybay-$version.tar.gz" \
            "$workdir/keybay-$version.hosted.tar.gz"
          python3 - "$RUNNER_TEMP/actual-predicate.json" \
            assurance/release-assurance.json <<'PY'
          import json, sys
          actual, expected = (json.load(open(path)) for path in sys.argv[1:3])
          if actual != expected:
              sys.exit("verified predicate differs from the attested manifest")
          PY
