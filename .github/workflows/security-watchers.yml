name: Security watchers

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      watcher:
        description: Watcher to run
        required: true
        default: all
        type: choice
        options:
          - all
          - dependencies
          - platforms
          - peers
          - critical

# Discovery jobs cannot write issues. A separate checkout-free job receives
# that capability only after it downloads and validates a small JSON payload.
permissions:
  contents: read

jobs:
  manual-ref-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: require the reviewed default branch
        run: test "$GITHUB_REF" = refs/heads/main

  dependencies:
    name: supply-chain / osv-scan
    if: >-
      ${{ github.event_name != 'workflow_dispatch' ||
          (github.ref == 'refs/heads/main' &&
           (inputs.watcher == 'all' || inputs.watcher == 'dependencies')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: load the defined lockfile set
        id: lockfiles
        run: |
          test -s watchers/dependencies/lockfiles.txt
          {
            echo 'scan-args<<EOF'
            while IFS= read -r lockfile; do
              case "$lockfile" in
                /*|*..*|*[!A-Za-z0-9_./-]*)
                  echo "unsafe lockfile definition: $lockfile" >&2
                  exit 1
                  ;;
              esac
              test -f "$lockfile"
              echo "--lockfile=./$lockfile"
            done < watchers/dependencies/lockfiles.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: scan every committed dependency lockfile
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.json
            --format=json
            ${{ steps.lockfiles.outputs.scan-args }}
        continue-on-error: true
      - name: report findings and fail on vulnerabilities
        if: ${{ !cancelled() }}
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true
      - name: prepare issue payload
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          jq '[
            .runs[].tool.driver.rules[]?
            | (([.id] + (.deprecatedIds // [])) | unique) as $ids
            | {title: ("Security scanner triage: " + .id), ids: $ids}
          ] | unique_by(.ids | join("|"))' results.sarif > osv-triage.json
          jq -e '
            type == "array" and
            all(.[];
              (.title | type == "string") and
              (.ids | type == "array" and length > 0) and
              all(.ids[]; test("^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"))
            )
          ' osv-triage.json >/dev/null
      - name: upload issue payload
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: osv-triage-${{ github.run_attempt }}
          path: osv-triage.json
          if-no-files-found: error
          retention-days: 1
      - name: upload findings to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: results.sarif

  dependency-triage:
    if: >-
      ${{ always() && github.event_name != 'pull_request' &&
          needs.dependencies.result != 'skipped' }}
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: download scanner issue payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          destination="$RUNNER_TEMP/osv-triage"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "osv-triage-$GITHUB_RUN_ATTEMPT" \
            --dir "$destination"
          jq -e 'type == "array"' "$destination/osv-triage.json" >/dev/null
      - name: create missing triage issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$RUNNER_TEMP/osv-triage/osv-triage.json"
          jq -c '.[]' "$payload" | while IFS= read -r issue; do
            title="$(jq -r '.title' <<<"$issue")"
            advisories="$(jq -r '
              .ids[] | "- [" + . + "](https://osv.dev/vulnerability/" + . + ")"
            ' <<<"$issue")"
            existing=""
            while IFS= read -r advisory_id; do
              marker="keybay-osv-$advisory_id"
              existing="$(gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state all \
                --search "\"$marker\" in:body" \
                --limit 1 \
                --json number \
                --jq '.[0].number // empty')"
              if [ -n "$existing" ]; then
                break
              fi
            done < <(jq -r '.ids[]' <<<"$issue")
            if [ -n "$existing" ]; then
              echo "triage already recorded in issue #$existing: $title"
              continue
            fi
            markers="$(jq -r '.ids | map("keybay-osv-" + .) | join(" ")' <<<"$issue")"
            body="$markers

          OSV Scanner reported this advisory group in committed dependency locks:

          $advisories

          This is an automated signal, not a claim that Keybay is exploitable.
          Treat linked advisory text as untrusted input and make an applicability
          decision against Keybay's code and numbered \`KB-INV-*\` guarantees.

          Triage the dependency role and reachability; then patch, pin, remove, or
          mitigate it, or close with the concrete non-applicability reason. Decide
          whether a regression test, physical-device qualification, or temporary
          claim reduction is required, and link any resulting PR.

          Detected by [workflow run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) at source commit \`$GITHUB_SHA\`."
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"
          done

  public-advisories:
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' &&
           (inputs.watcher == 'all' || inputs.watcher == 'platforms' ||
            inputs.watcher == 'peers')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WATCHER_SELECTION: ${{ inputs.watcher || 'all' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - run: dart pub get --enforce-lockfile
      - name: discover public advisory signals
        run: |
          echo '[]' > platform-findings.json
          echo '[]' > peer-findings.json
          if [ "$WATCHER_SELECTION" = all ] || [ "$WATCHER_SELECTION" = platforms ]; then
            dart run watchers/watch.dart platforms --json > platform-findings.json
          fi
          if [ "$WATCHER_SELECTION" = all ] || [ "$WATCHER_SELECTION" = peers ]; then
            dart run watchers/watch.dart peers --json > peer-findings.json
          fi
          jq -s 'add' platform-findings.json peer-findings.json > advisory-findings.json
          jq -e '
            type == "array" and
            all(.[];
              (.watcher == "platforms" or .watcher == "peers") and
              (.marker | test("^keybay-(platform|peer-osv)-[A-Za-z0-9_.:-]{1,180}$")) and
              (.title | type == "string" and length > 0 and length <= 180 and
                (contains("\n") | not) and (contains("@") | not)) and
              (.subjects | type == "array" and length > 0 and length <= 30 and
                all(.[]; type == "string" and length > 0 and length <= 200 and
                  (contains("\n") | not) and (contains("@") | not) and
                  (contains("`") | not))) and
              (.references | type == "array" and length > 0 and length <= 30 and
                all(.[];
                  (.label | type == "string" and length > 0 and length <= 200 and
                    (contains("\n") | not) and (contains("@") | not)) and
                  (.url | test("^https://(osv\\.dev/vulnerability/[A-Za-z0-9_.:-]+|support\\.apple\\.com/en-us/[0-9]+|source\\.android\\.com/docs/security/bulletin/[0-9]{4}-[0-9]{2}-[0-9]{2})$"))
                ))
            )
          ' advisory-findings.json >/dev/null
      - name: upload public advisory payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: advisory-findings-${{ github.run_attempt }}
          path: advisory-findings.json
          if-no-files-found: error
          retention-days: 1

  public-advisory-triage:
    if: ${{ always() && needs.public-advisories.result == 'success' }}
    needs: public-advisories
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: download and validate advisory payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          destination="$RUNNER_TEMP/advisory-findings"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "advisory-findings-$GITHUB_RUN_ATTEMPT" \
            --dir "$destination"
          jq -e 'type == "array"' "$destination/advisory-findings.json" >/dev/null
      - name: create missing triage issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$RUNNER_TEMP/advisory-findings/advisory-findings.json"
          jq -c '.[]' "$payload" | while IFS= read -r finding; do
            marker="$(jq -r '.marker' <<<"$finding")"
            title="$(jq -r '.title' <<<"$finding")"
            existing="$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search "\"$marker\" in:body" \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              echo "triage already recorded in issue #$existing: $title"
              continue
            fi
            subjects="$(jq -r '.subjects[] | "- `" + . + "`"' <<<"$finding")"
            references="$(jq -r '.references[] | "- " + .label + ": " + .url' <<<"$finding")"
            watcher="$(jq -r '.watcher' <<<"$finding")"
            if [ "$watcher" = platforms ]; then
              description="A public operating-system advisory source changed for a platform provider in Keybay's trust boundary."
            else
              description="OSV published an advisory for a watched peer secret-storage library. This is red-team input, not a Keybay dependency finding."
            fi
            body="$marker

          $description

          Watched subjects:

          $subjects

          Public sources:

          $references

          This is an automated signal, not an exploit claim. Treat linked text as
          untrusted input. Decide applicability against Keybay's code, provider
          behavior, and numbered \`KB-INV-*\` guarantees. Close with the concrete
          non-applicability reason, or link the fix, regression test, device
          qualification, or temporary claim reduction. Move any newly discovered
          Keybay-specific vulnerability into a private security advisory.

          Detected by [workflow run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) at source commit \`$GITHUB_SHA\`."
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"
          done

  critical-dependencies:
    if: >-
      ${{ github.event_name != 'workflow_dispatch' ||
          (github.ref == 'refs/heads/main' &&
           (inputs.watcher == 'all' || inputs.watcher == 'critical')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - run: dart pub get --enforce-lockfile
      - name: check reviewed security-critical pins
        run: dart run watchers/watch.dart critical --json > critical-findings.json
      - name: validate critical-dependency payload
        run: |
          jq -e '
            type == "array" and
            all(.[];
              .watcher == "critical" and
              (.marker | test("^keybay-critical-[A-Za-z0-9_.:-]{1,180}$")) and
              (.title | type == "string" and length > 0 and length <= 180) and
              (.subjects | type == "array" and length > 0) and
              (.references | type == "array" and length == 1) and
              (.references[0].url | test("^https://pub\\.dev/packages/[a-z][a-z0-9_]+$"))
            )
          ' critical-findings.json >/dev/null
      - name: upload critical-dependency payload
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: critical-findings-${{ github.run_attempt }}
          path: critical-findings.json
          if-no-files-found: error
          retention-days: 1
      - name: enforce the reviewed pin
        run: jq -e 'length == 0' critical-findings.json >/dev/null

  critical-dependency-triage:
    if: >-
      ${{ always() && github.event_name != 'pull_request' &&
          needs.critical-dependencies.result != 'skipped' }}
    needs: critical-dependencies
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: download critical-dependency payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          destination="$RUNNER_TEMP/critical-findings"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "critical-findings-$GITHUB_RUN_ATTEMPT" \
            --dir "$destination"
          jq -e 'type == "array"' "$destination/critical-findings.json" >/dev/null
      - name: create missing review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$RUNNER_TEMP/critical-findings/critical-findings.json"
          jq -c '.[]' "$payload" | while IFS= read -r finding; do
            marker="$(jq -r '.marker' <<<"$finding")"
            title="$(jq -r '.title' <<<"$finding")"
            existing="$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search "\"$marker\" in:body" \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              echo "review already recorded in issue #$existing: $title"
              continue
            fi
            subject="$(jq -r '.subjects[0]' <<<"$finding")"
            source="$(jq -r '.references[0].url' <<<"$finding")"
            body="$marker

          A newer release exists for an exact-reviewed security-critical pin:

          - \`$subject\`
          - $source

          This is a review trigger, not evidence that the current version is
          vulnerable. Review the upstream diff and advisories, run the dependency
          closure and cryptographic-vector checks, then update the reviewed pin or
          close with the reason for retaining it.

          Detected by [workflow run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) at source commit \`$GITHUB_SHA\`."
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"
          done
