name: Security watchers

on:
  push:
    branches: [main]
    paths-ignore:
      - watchers/reports/**
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      watcher:
        description: Watcher to run
        required: true
        default: all
        type: choice
        options:
          - all
          - dependencies
          - platforms
          - peers

# Ordinary CI is read-only except for SARIF publication. Scheduled and manual
# discovery is also read-only; a separate job validates its artifact before it
# gets the narrow permission needed to push a report-only staging branch.
permissions:
  contents: read

jobs:
  dependencies:
    name: supply-chain / osv-scan
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: load the defined lockfile set
        id: lockfiles
        run: |
          test -s watchers/dependencies/lockfiles.txt
          {
            echo 'scan-args<<EOF'
            while IFS= read -r lockfile; do
              case "$lockfile" in
                /*|*..*|*[!A-Za-z0-9_./-]*)
                  echo "unsafe lockfile definition: $lockfile" >&2
                  exit 1
                  ;;
              esac
              test -f "$lockfile"
              echo "--lockfile=./$lockfile"
            done < watchers/dependencies/lockfiles.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: scan every committed dependency lockfile
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.json
            --format=json
            ${{ steps.lockfiles.outputs.scan-args }}
        continue-on-error: true
      - name: report findings and fail on vulnerabilities
        if: ${{ !cancelled() }}
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true
      - name: upload findings to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: results.sarif

  report-discovery:
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WATCHER_SELECTION: ${{ inputs.watcher || 'all' }}
      INPUT_DIRECTORY: watcher-inputs
    steps:
      - name: initialize explicit incomplete results
        run: |
          mkdir -p "$INPUT_DIRECTORY"
          for watcher in dependencies platforms peers; do
            jq -n \
              --arg watcher "$watcher" \
              '{watcher: $watcher, status: "not_run", findings: [], error: "Watcher step did not complete."}' \
              > "$INPUT_DIRECTORY/$watcher.json"
          done
      - name: check out the reviewed default branch
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: install Dart
        id: dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - name: resolve the committed workspace
        id: pub_get
        run: dart pub get --enforce-lockfile

      - name: load the dependency lockfile set
        id: report_lockfiles
        if: >-
          ${{ always() && steps.pub_get.outcome == 'success' &&
              (env.WATCHER_SELECTION == 'all' ||
               env.WATCHER_SELECTION == 'dependencies') }}
        run: |
          test -s watchers/dependencies/lockfiles.txt
          {
            echo 'scan-args<<EOF'
            while IFS= read -r lockfile; do
              case "$lockfile" in
                /*|*..*|*[!A-Za-z0-9_./-]*)
                  echo "unsafe lockfile definition: $lockfile" >&2
                  exit 1
                  ;;
              esac
              test -f "$lockfile"
              echo "--lockfile=./$lockfile"
            done < watchers/dependencies/lockfiles.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: discover resolved dependency vulnerabilities
        id: report_osv_scan
        if: ${{ always() && steps.report_lockfiles.outcome == 'success' }}
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=report-osv-results.json
            --format=json
            ${{ steps.report_lockfiles.outputs.scan-args }}
        continue-on-error: true
      - name: convert dependency vulnerabilities to SARIF
        id: report_osv_sarif
        if: >-
          ${{ always() && steps.report_osv_scan.outcome != 'skipped' }}
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=report-osv-results.sarif
            --new=report-osv-results.json
            --gh-annotations=false
        continue-on-error: true
      - name: discover reviewed dependency releases
        id: report_dependency_releases
        if: >-
          ${{ always() && steps.pub_get.outcome == 'success' &&
              (env.WATCHER_SELECTION == 'all' ||
               env.WATCHER_SELECTION == 'dependencies') }}
        run: >-
          dart run watchers/watch.dart dependencies --json
          > "$RUNNER_TEMP/dependency-releases.json"
        continue-on-error: true
      - name: normalize dependency results
        if: ${{ always() }}
        env:
          LOCKFILES_OUTCOME: ${{ steps.report_lockfiles.outcome }}
          RELEASES_OUTCOME: ${{ steps.report_dependency_releases.outcome }}
        run: |
          output="$INPUT_DIRECTORY/dependencies.json"
          if [ "$WATCHER_SELECTION" != all ] && [ "$WATCHER_SELECTION" != dependencies ]; then
            jq -n '{watcher: "dependencies", status: "not_run", findings: [], error: "Not selected for this on-demand run."}' > "$output"
            exit 0
          fi

          errors=()
          osv='[]'
          releases='[]'
          if [ "$LOCKFILES_OUTCOME" != success ] || \
             [ ! -s report-osv-results.sarif ] || \
             ! jq -e '.runs | type == "array"' report-osv-results.sarif >/dev/null 2>&1; then
            errors+=("Resolved lockfile OSV scan did not produce valid SARIF.")
          else
            osv="$(jq -c '[
              .runs[].tool.driver.rules[]?
              | .id as $id
              | select($id | test("^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"))
              | {
                  watcher: "dependencies",
                  marker: ("keybay-dependency-osv-" + $id),
                  title: ("Resolved dependency advisory: " + $id),
                  subjects: ["Committed resolved dependency graph"],
                  references: [{label: $id, url: ("https://osv.dev/vulnerability/" + $id)}]
                }
            ] | unique_by(.marker)' report-osv-results.sarif)"
          fi
          if [ "$RELEASES_OUTCOME" != success ] || \
             [ ! -s "$RUNNER_TEMP/dependency-releases.json" ] || \
             ! jq -e 'type == "array"' "$RUNNER_TEMP/dependency-releases.json" >/dev/null 2>&1; then
            errors+=("Reviewed dependency release check did not complete.")
          else
            releases="$(jq -c '.' "$RUNNER_TEMP/dependency-releases.json")"
          fi
          findings="$(jq -cn --argjson left "$osv" --argjson right "$releases" '$left + $right')"
          if (( ${#errors[@]} )); then
            error="$(IFS=' '; echo "${errors[*]}")"
            jq -n \
              --argjson findings "$findings" \
              --arg error "$error" \
              '{watcher: "dependencies", status: "failed", findings: $findings, error: $error}' \
              > "$output"
          elif [ "$(jq 'length' <<<"$findings")" -gt 0 ]; then
            jq -n \
              --argjson findings "$findings" \
              '{watcher: "dependencies", status: "findings", findings: $findings, error: null}' \
              > "$output"
          else
            jq -n '{watcher: "dependencies", status: "quiet", findings: [], error: null}' > "$output"
          fi

      - name: discover platform advisories
        id: report_platforms
        if: >-
          ${{ always() && steps.pub_get.outcome == 'success' &&
              (env.WATCHER_SELECTION == 'all' ||
               env.WATCHER_SELECTION == 'platforms') }}
        run: >-
          dart run watchers/watch.dart platforms --json
          > "$RUNNER_TEMP/platform-findings.json"
        continue-on-error: true
      - name: normalize platform results
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.report_platforms.outcome }}
        run: |
          output="$INPUT_DIRECTORY/platforms.json"
          if [ "$WATCHER_SELECTION" != all ] && [ "$WATCHER_SELECTION" != platforms ]; then
            jq -n '{watcher: "platforms", status: "not_run", findings: [], error: "Not selected for this on-demand run."}' > "$output"
          elif [ "$OUTCOME" != success ] || \
               [ ! -s "$RUNNER_TEMP/platform-findings.json" ] || \
               ! jq -e 'type == "array"' "$RUNNER_TEMP/platform-findings.json" >/dev/null 2>&1; then
            jq -n '{watcher: "platforms", status: "failed", findings: [], error: "Platform advisory discovery did not complete."}' > "$output"
          elif [ "$(jq 'length' "$RUNNER_TEMP/platform-findings.json")" -gt 0 ]; then
            jq -n \
              --argjson findings "$(jq -c '.' "$RUNNER_TEMP/platform-findings.json")" \
              '{watcher: "platforms", status: "findings", findings: $findings, error: null}' \
              > "$output"
          else
            jq -n '{watcher: "platforms", status: "quiet", findings: [], error: null}' > "$output"
          fi

      - name: discover peer activity
        id: report_peers
        if: >-
          ${{ always() && steps.pub_get.outcome == 'success' &&
              (env.WATCHER_SELECTION == 'all' ||
               env.WATCHER_SELECTION == 'peers') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dart run watchers/watch.dart peers --json
          > "$RUNNER_TEMP/peer-findings.json"
        continue-on-error: true
      - name: normalize peer results
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.report_peers.outcome }}
        run: |
          output="$INPUT_DIRECTORY/peers.json"
          if [ "$WATCHER_SELECTION" != all ] && [ "$WATCHER_SELECTION" != peers ]; then
            jq -n '{watcher: "peers", status: "not_run", findings: [], error: "Not selected for this on-demand run."}' > "$output"
          elif [ "$OUTCOME" != success ] || \
               [ ! -s "$RUNNER_TEMP/peer-findings.json" ] || \
               ! jq -e 'type == "array"' "$RUNNER_TEMP/peer-findings.json" >/dev/null 2>&1; then
            jq -n '{watcher: "peers", status: "failed", findings: [], error: "Peer advisory and repository activity discovery did not complete."}' > "$output"
          elif [ "$(jq 'length' "$RUNNER_TEMP/peer-findings.json")" -gt 0 ]; then
            jq -n \
              --argjson findings "$(jq -c '.' "$RUNNER_TEMP/peer-findings.json")" \
              '{watcher: "peers", status: "findings", findings: $findings, error: null}' \
              > "$output"
          else
            jq -n '{watcher: "peers", status: "quiet", findings: [], error: null}' > "$output"
          fi

      - name: upload normalized discovery inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: watcher-report-inputs-${{ github.run_attempt }}
          path: watcher-inputs
          if-no-files-found: error
          retention-days: 2
      - name: make incomplete discovery visible
        if: ${{ always() }}
        run: |
          if jq -s -e 'any(.[]; .status == "failed")' "$INPUT_DIRECTORY"/*.json >/dev/null; then
            echo 'One or more selected watcher sources failed; the report records the failure.' >&2
            exit 1
          fi

  report-stage:
    if: >-
      ${{ always() &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main')) }}
    needs: report-discovery
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: check out the exact discovery commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - run: dart pub get --enforce-lockfile
      - name: download discovery inputs
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          destination="$RUNNER_TEMP/watcher-inputs"
          mkdir -p "$destination"
          if ! gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "watcher-report-inputs-$GITHUB_RUN_ATTEMPT" \
            --dir "$destination"; then
            for watcher in dependencies platforms peers; do
              jq -n \
                --arg watcher "$watcher" \
                '{watcher: $watcher, status: "failed", findings: [], error: "Discovery artifact was unavailable."}' \
                > "$destination/$watcher.json"
            done
          fi
      - name: validate and render the report pair
        id: render
        run: |
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          report_date="${started_at%%T*}"
          report_directory="watchers/reports/$report_date-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          dart run watchers/report.dart create \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --commit "$GITHUB_SHA" \
            --started-at "$started_at" \
            --dependencies "$RUNNER_TEMP/watcher-inputs/dependencies.json" \
            --platforms "$RUNNER_TEMP/watcher-inputs/platforms.json" \
            --peers "$RUNNER_TEMP/watcher-inputs/peers.json" \
            --output "$report_directory"
          dart run watchers/report.dart summary \
            --reports watchers/reports \
            --output watchers/reports/SUMMARY.md
          echo "report-directory=$report_directory" >> "$GITHUB_OUTPUT"
          echo "report-date=$report_date" >> "$GITHUB_OUTPUT"
      - name: push one pending assessment branch
        env:
          REPORT_DIRECTORY: ${{ steps.render.outputs.report-directory }}
          REPORT_DATE: ${{ steps.render.outputs.report-date }}
        run: |
          branch="security-report/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add "$REPORT_DIRECTORY" watchers/reports/SUMMARY.md
          git commit -m "security: record watcher report $REPORT_DATE"
          git push origin "$branch"
