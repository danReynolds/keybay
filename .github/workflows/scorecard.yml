# OpenSSF Scorecard as a repo-configuration regression watch: branch
# protection, token permissions, and dependency pinning are settings nothing
# else continuously checks, and a solo maintainer can regress them silently.
# The action runs every upstream check, but only the small actionable set below
# reaches code scanning. Results are deliberately NOT published to the
# Scorecard API: this is a regression check, not a badge.
name: scorecard

on:
  schedule:
    - cron: '41 6 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: retain actionable repository controls
        run: |
          jq '
            .runs[].results |= map(
              select(
                .ruleId as $id
                | [
                    "BranchProtectionID",
                    "CITestsID",
                    "DangerousWorkflowID",
                    "PinnedDependenciesID",
                    "SecurityPolicyID",
                    "TokenPermissionsID"
                  ]
                | index($id)
              )
            )
          ' results.sarif > actionable-results.sarif
          jq -e 'all(.runs[]; .results | type == "array")' \
            actionable-results.sarif >/dev/null
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: actionable-results.sarif
