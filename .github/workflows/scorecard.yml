# OpenSSF Scorecard as a repo-configuration regression watch: branch
# protection, token permissions, and dependency pinning are settings nothing
# else continuously checks, and a solo maintainer can regress them silently.
# Results go to code scanning only — deliberately NOT published to the
# Scorecard API: this is a check, not a badge.
name: scorecard

on:
  schedule:
    - cron: '41 6 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
