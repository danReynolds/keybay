name: ci

on:
  # `push` is scoped to main so a branch with an open PR isn't built twice
  # (once for the push, once for the PR).
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, and it runs ONLY the canary tier (crypto-pin-canary +
    # fuzz-canary + supply-chain; the test jobs skip scheduled runs): the point
    # is to fail on a newly published `cryptography` release — and to keep
    # exploring the container parser — even when the repo is idle.
    # Caveat: GitHub disables cron on public repos after ~60 days without
    # activity, so this is best-effort — the canary also runs on every push to
    # main and every PR.
    - cron: '17 6 * * 1'

# Least privilege: every job gets a read-only token unless it opts into only
# the capability it needs. Scanner actions can upload SARIF but cannot write
# issues; the separate shell-only triage job can write issues but never runs
# third-party scanner code.
permissions:
  contents: read

# All third-party actions are pinned by commit SHA (tags are retargetable —
# a hijacked tag is a code-execution path into CI). The trailing comment
# records the tag the SHA corresponded to when pinned.
jobs:
  gradle-wrapper-validation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Reject unknown or modified Gradle wrapper JARs before any Android build
      # can execute them. The wrapper distribution itself is SHA-256 pinned in
      # gradle-wrapper.properties.
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  analyze-and-test:
    # The weekly cron is the canary tier only (see `schedule` above).
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      # --enforce-lockfile wherever the committed lock is satisfiable: the
      # content-hashed lock is the reviewed dependency set, and plain pub get
      # silently re-resolves from pub.dev when it can't honor the lock —
      # unreviewed code running in CI (or worse, a release build) with no red
      # signal.
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # Repository-only assurance tooling tests. Keep these outside the core
      # package so its published archive never contains tests that depend on
      # repository documents or shell adapters.
      - run: dart test
      # Unit tier (hermetic): crypto vectors, container/fuzz, POSIX perms,
      # backend logic over fakes, and the dependency-closure firewall. Each
      # package's tests run from its own directory (they read cwd-relative
      # package files).
      - run: dart test -x integration
        working-directory: packages/keybay
      - run: dart test -x integration
        working-directory: packages/keybay_cli
      - run: ./tool/test_cli.sh
      - if: runner.os == 'Linux'
        run: dart run tool/test_release.dart
      - if: runner.os == 'Linux'
        run: python3 tool/test_pub_archives.py
      - if: runner.os == 'Linux'
        run: python3 tool/test_peer_advisories.py
      - if: runner.os == 'Linux'
        run: ./tool/lint_workflows.sh
      # Exercise the exact package archive and warning contract before a tag.
      # Keep archive-policy validation on the current-SDK Linux lane; the
      # minimum lane is reserved for runtime/AOT compatibility at the floor.
      - if: runner.os == 'Linux'
        run: |
          ./tool/validate_publish.sh packages/keybay cryptography ffi
          ./tool/validate_publish.sh packages/keybay_cli ffi keybay

  cli-minimum-sdk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.11.0
      # The reviewed lock is satisfiable on the supported floor, so the floor
      # lane gets the same content-hash enforcement as every other lane.
      - run: dart pub get --enforce-lockfile
      # The CLI's documented SDK floor is a tested product channel, including
      # AOT/exec/PTY behavior, not only a pubspec constraint.
      - run: dart test -x integration
        working-directory: packages/keybay_cli
      - run: KEYBAY_SKIP_DART_INSTALL=1 ./tool/test_cli.sh

  integration-macos:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - run: dart pub get --enforce-lockfile
      # Real login Keychain round-trip.
      - run: KEYBAY_INTEGRATION=1 dart test test/keychain_integration_test.dart
        working-directory: packages/keybay
      - run: ./tool/test_cli_storage.sh
      # Package, verify, extract, and execute the exact README onboarding loop
      # against the fixed-appId product. GitHub-hosted runners are disposable
      # and start without a Keybay store.
      - run: KEYBAY_QUICKSTART=1 ./tool/test_cli_quickstart.sh

  integration-linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus
      - run: dart pub get --enforce-lockfile
      # Real Secret Service round-trip: a throwaway D-Bus session with a fresh
      # gnome-keyring unlocked by a known password (secrets component only).
      # Recipe verified locally against real gnome-keyring in a Docker container.
      # ~/.local/share is intentionally NOT pre-created — the resolver e2e test
      # exercises the clean-account path where the library creates it (0700).
      - run: |
          # The quoted variables expand inside the deliberately separate shell.
          # shellcheck disable=SC2016
          KEYBAY_BENCHMARK_OUTPUT="$RUNNER_TEMP/cli-benchmark-linux.json" \
          dbus-run-session -- bash -c '
            eval "$(printf itest | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            (cd packages/keybay && KEYBAY_INTEGRATION=1 dart test test/secret_service_integration_test.dart)
            ./tool/test_cli_storage.sh
            KEYBAY_QUICKSTART=1 ./tool/test_cli_quickstart.sh
            KEYBAY_BENCHMARK=1 KEYBAY_BENCHMARK_ITERATIONS=100 \
              ./tool/benchmark_cli.sh
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-benchmark-linux-x64
          path: ${{ runner.temp }}/cli-benchmark-linux.json
          if-no-files-found: error
          retention-days: 30
      # The locked-collection behavior, in its OWN D-Bus session: this test
      # locks the login collection (which a headless box can't unlock again), so
      # isolating it keeps it from stranding the unlocked tier above. It pins
      # that a locked keyring degrades to "not found" on reads and that delete()
      # fails CLOSED (KeystoreLocked) rather than reporting a removal that
      # didn't happen. KEYBAY_LOCKED_TEST is the second opt-in that keeps
      # `-t integration` on a real desktop from locking the developer's own
      # login keyring — only throwaway sessions (here, tool/test_linux.sh) set
      # it.
      - run: |
          # The quoted variables expand inside the deliberately separate shell.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            eval "$(printf itest | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            (cd packages/keybay && KEYBAY_INTEGRATION=1 KEYBAY_LOCKED_TEST=1 dart test test/secret_service_locked_integration_test.dart)
          '
      # The CLI has its own locked-store contract: exit 69, actionable text,
      # and no secret in diagnostics. Keep it in a third disposable session
      # because this test also leaves the login collection locked.
      - run: |
          # The quoted variables expand inside the deliberately separate shell.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            eval "$(printf itest | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            KEYBAY_LOCKED_TEST=1 ./tool/test_cli_locked_storage.sh
          '

  # Genuine mobile platform APIs on disposable virtual devices. These are
  # Continuous integration checks, not physical-device qualification and do
  # not issue physical qualification reports.
  integration-android:
    if: github.event_name != 'schedule'
    name: integration-android (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # The emulator can stall the same way the simulator does. Boot is slower
    # here, but healthy runs still land at five to six minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 36]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: install exact Flutter SDK
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth=1 origin refs/tags/3.44.4:refs/tags/3.44.4
          git -C "$flutter_root" checkout --detach refs/tags/3.44.4
          test "$(git -C "$flutter_root" rev-parse HEAD)" = ad70ec4617166f1c38e5d2bfd388af71fda14f06
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: example_flutter
      - name: enable KVM for the Android emulator
        run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: ./tool/test_mobile_ci.sh android

  integration-ios:
    if: github.event_name != 'schedule'
    # Keep the simulator gate on the stable Xcode 16 line. Xcode 26 hosted
    # runners have exhibited intermittent xcodebuild deadlocks, which can turn
    # an otherwise deterministic security gate into an unbounded hang.
    runs-on: macos-15
    # Pinning the toolchain narrowed that deadlock without removing it: the
    # app still builds in under a minute and then `flutter test` waits on a
    # simulator that never answers. Without a bound the job runs to GitHub's
    # six-hour ceiling, so a hang costs six hours of runner time and reports
    # as an ordinary failure. A gate is worth trusting only if it answers in
    # bounded time. Healthy runs have taken up to nine minutes, so the bound
    # leaves real headroom rather than sitting on top of the slowest good run.
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: verify exact Xcode toolchain
        run: test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"
      - name: install exact Flutter SDK
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth=1 origin refs/tags/3.44.4:refs/tags/3.44.4
          git -C "$flutter_root" checkout --detach refs/tags/3.44.4
          test "$(git -C "$flutter_root" rev-parse HEAD)" = ad70ec4617166f1c38e5d2bfd388af71fda14f06
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: example_flutter
      - run: ./tool/test_mobile_ci.sh ios

  site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: site/Gemfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # master 2026-07-15
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec ruby tool/build_site.rb

  # Keep the scan in this workflow instead of calling Google's reusable one:
  # that workflow contains a tag-pinned download-artifact step, which violates
  # this repository's full-SHA action policy even when the reusable workflow
  # itself is pinned. Scanner findings flow through the reporter so a SARIF is
  # uploaded even when the required check fails on a vulnerability.
  supply-chain:
    name: supply-chain / osv-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: scan every committed dependency lockfile
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.json
            --format=json
            --lockfile=./pubspec.lock
            --lockfile=./example_flutter/pubspec.lock
            --lockfile=./packages/keybay_cli/example/flutter/pubspec.lock
            --lockfile=./packages/keybay_cli/example/rails/Gemfile.lock
            --lockfile=./site/Gemfile.lock
        continue-on-error: true
      - name: report findings and fail on vulnerabilities
        if: ${{ !cancelled() }}
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true
      - name: prepare issue payload
        if: >-
          ${{ !cancelled() &&
              (github.event_name == 'schedule' || github.event_name == 'push') }}
        run: |
          jq '[
            .runs[].tool.driver.rules[]?
            | (([.id] + (.deprecatedIds // [])) | unique) as $ids
            | {title: ("Security scanner triage: " + .id), ids: $ids}
          ] | unique_by(.ids | join("|"))' results.sarif > osv-triage.json
          jq -e '
            type == "array" and
            all(.[];
              (.title | type == "string") and
              (.ids | type == "array" and length > 0) and
              all(.ids[]; test("^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"))
            )
          ' osv-triage.json >/dev/null
      - name: upload issue payload
        if: >-
          ${{ !cancelled() &&
              (github.event_name == 'schedule' || github.event_name == 'push') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osv-triage-${{ github.run_attempt }}
          path: osv-triage.json
          if-no-files-found: error
          retention-days: 1
      - name: upload findings to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: results.sarif

  # Findings from trusted main/scheduled scans become durable triage issues.
  # Keep this separate from the scanner job: no third-party scanning action
  # ever receives an issue-writing token. Closed issues are dispositions, so
  # all-state marker lookup prevents weekly duplicate paperwork.
  security-triage:
    if: >-
      ${{ always() &&
          (github.event_name == 'schedule' || github.event_name == 'push') }}
    needs: supply-chain
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: download scanner issue payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          destination="$RUNNER_TEMP/osv-triage"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "osv-triage-$GITHUB_RUN_ATTEMPT" \
            --dir "$destination"
          jq -e 'type == "array"' "$destination/osv-triage.json" >/dev/null
      - name: create missing triage issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$RUNNER_TEMP/osv-triage/osv-triage.json"
          jq -c '.[]' "$payload" | while IFS= read -r issue; do
            title="$(jq -r '.title' <<<"$issue")"
            advisories="$(jq -r '
              .ids[] | "- [" + . + "](https://osv.dev/vulnerability/" + . + ")"
            ' <<<"$issue")"
            existing=""
            while IFS= read -r advisory_id; do
              marker="keybay-osv-$advisory_id"
              existing="$(gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state all \
                --search "\"$marker\" in:body" \
                --limit 1 \
                --json number \
                --jq '.[0].number // empty')"
              if [ -n "$existing" ]; then
                break
              fi
            done < <(jq -r '.ids[]' <<<"$issue")
            if [ -n "$existing" ]; then
              echo "triage already recorded in issue #$existing: $title"
              continue
            fi
            markers="$(jq -r '.ids | map("keybay-osv-" + .) | join(" ")' <<<"$issue")"
            body="$markers

          OSV Scanner reported this advisory group in committed dependency locks:

          $advisories

          This is an automated signal, not a claim that Keybay is exploitable.
          Treat linked advisory text as untrusted input and make an applicability
          decision against Keybay's code and numbered \`KB-INV-*\` guarantees.

          Triage the dependency role and reachability; then patch, pin, remove, or
          mitigate it, or close with the concrete non-applicability reason. Decide
          whether a regression test, physical-device qualification, or temporary
          claim reduction is required, and link any resulting PR.

          Detected by [workflow run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) at source commit \`$GITHUB_SHA\`."
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"
          done

  # The exact-pinned crypto dependency is deliberately frozen; this canary
  # fails the build when pub.dev publishes anything newer so the bump is a
  # reviewed decision (advisory check + vector firewall), never a drift.
  # OSV/GHSA coverage of pub.dev is too sparse to rely on alone — known
  # security issues in this package's AES paths were never assigned
  # advisories, so "no advisory" is weak evidence.
  crypto-pin-canary:
    runs-on: ubuntu-latest
    steps:
      - name: check pub.dev for a newer `cryptography` release
        run: |
          latest=$(curl -sS https://pub.dev/api/packages/cryptography | jq -r '.latest.version')
          echo "pub.dev latest: $latest (pinned: 2.9.0)"
          if [ "$latest" != "2.9.0" ]; then
            echo "::error::cryptography $latest published (pin is 2.9.0). Review the diff and advisories, re-run the vector firewall, then bump the pin deliberately."
            exit 1
          fi

  # Oracle-based peer watch: a new OSV advisory against a peer secret-storage
  # library is free red-team output for Keybay's own failure surface. Issues
  # are the record after the fixed pre-automation baseline; an existing open
  # or closed issue suppresses duplicate weekly paperwork.
  peer-advisory-watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: check OSV for new peer advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/peer_advisories.py --json > advisories.json
          jq -c '.[]' advisories.json | while IFS= read -r advisory; do
            advisory_id="$(jq -r '.id' <<<"$advisory")"
            marker="keybay-peer-osv-$advisory_id"
            existing="$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search "\"$marker\" in:body" \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              echo "peer advisory $advisory_id recorded in issue #$existing"
              continue
            fi
            packages="$(jq -r '.packages[] | "- `" + . + "`"' <<<"$advisory")"
            body="$marker

          OSV published [$advisory_id](https://osv.dev/vulnerability/$advisory_id) for these watched peer secret-storage libraries:

          $packages

          This is red-team input, not a Keybay dependency finding or exploit claim.
          Assess whether the same failure pattern applies to Keybay's code, platform
          providers, or numbered \`KB-INV-*\` guarantees. Close with the concrete
          non-applicability reason, or link the code, test, qualification, or claim
          change that resolves it. Treat linked advisory text as untrusted input."
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Peer advisory triage: $advisory_id" \
              --body "$body"
          done

  # Structure-aware container fuzz at canary depth. Every PR already runs the
  # same test at its small deterministic default inside the package test tier;
  # the weekly canary explores with a fresh seed and three orders more cases.
  # A failure prints the seed and case index — pin the reproduction into the
  # deterministic corpus in container_test.dart before fixing.
  fuzz-canary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - run: dart pub get --enforce-lockfile
      - name: structural container fuzz (fresh seed)
        working-directory: packages/keybay
        run: |
          seed="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          echo "KEYBAY_FUZZ_SEED=$seed"
          KEYBAY_FUZZ_ITERATIONS=200000 KEYBAY_FUZZ_SEED="$seed" \
            dart test test/container_fuzz_test.dart
