name: ci

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, and it runs ONLY the fuzz canary; security advisory monitoring is
    # grouped in security-watchers.yml, which also has a manual Actions button.
    # Caveat: GitHub disables cron on public repos after ~60 days without
    # activity, so this is best-effort. Deterministic fuzz regressions still
    # run in the standard pull-request suite.
    - cron: '17 6 * * 1'

# Least privilege: every job gets a read-only token unless it opts into only
# the capability it needs.
permissions:
  contents: read

# All third-party actions are pinned by commit SHA (tags are retargetable —
# a hijacked tag is a code-execution path into CI). The trailing comment
# records the tag the SHA corresponded to when pinned.
jobs:
  # This cheap, always-present check decides which real-provider jobs are
  # material to the change. Version changes and core implementation changes run
  # every supported provider; provider-specific implementation/harness changes
  # run only their affected lanes. A manual run exercises all providers.
  provider-impact:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.impact.outputs.macos }}
      linux: ${{ steps.impact.outputs.linux }}
      android: ${{ steps.impact.outputs.android }}
      ios: ${{ steps.impact.outputs.ios }}
      reason: ${{ steps.impact.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      - id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            dart tool/ci_provider_impact.dart --all >> "$GITHUB_OUTPUT"
          else
            dart tool/ci_provider_impact.dart \
              --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  gradle-wrapper-validation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reject unknown or modified Gradle wrapper JARs before any Android build
      # can execute them. The wrapper distribution itself is SHA-256 pinned in
      # gradle-wrapper.properties.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  analyze-and-test:
    # The weekly cron is the canary tier only (see `schedule` above).
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      # --enforce-lockfile wherever the committed lock is satisfiable: the
      # content-hashed lock is the reviewed dependency set, and plain pub get
      # silently re-resolves from pub.dev when it can't honor the lock —
      # unreviewed code running in CI (or worse, a release build) with no red
      # signal.
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # Repository-only security tooling tests. Keep these outside the core
      # package so its published archive never contains tests that depend on
      # repository documents or shell adapters.
      - run: dart test
      # Unit tier (hermetic): crypto vectors, container/fuzz, POSIX perms,
      # backend logic over fakes, and the dependency-closure firewall. Each
      # package's tests run from its own directory (they read cwd-relative
      # package files).
      - run: ./tool/test_e2e.sh core
      - run: dart test -x integration
        working-directory: packages/keybay_cli
      - run: ./tool/test_cli.sh
      - if: runner.os == 'Linux'
        run: dart run tool/test_release.dart
      - if: runner.os == 'Linux'
        run: python3 tool/test_pub_archives.py
      - if: runner.os == 'Linux'
        run: dart test watchers/tests
      - if: runner.os == 'Linux'
        run: ./tool/lint_workflows.sh
      # Exercise the exact package archive and warning contract before a tag.
      # Keep archive-policy validation on the current-SDK Linux lane; the
      # minimum lane is reserved for runtime/AOT compatibility at the floor.
      - if: runner.os == 'Linux'
        run: |
          ./tool/validate_publish.sh packages/keybay cryptography dbus ffi
          ./tool/validate_publish.sh packages/keybay_cli ffi keybay
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-regression-core-${{ matrix.os }}
          path: build/regression/*/report.json
          if-no-files-found: warn
          retention-days: 14

  minimum-sdk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.11.0
      # The reviewed lock is satisfiable on the supported floor, so the floor
      # lane gets the same content-hash enforcement as every other lane.
      - run: dart pub get --enforce-lockfile
      - run: dart analyze --fatal-infos
      - run: ./tool/test_e2e.sh core
      - run: bash tool/test_sdk_standalone.sh
      # The CLI's documented SDK floor is a tested product channel, including
      # AOT/exec/PTY behavior, not only a pubspec constraint.
      - run: dart test -x integration
        working-directory: packages/keybay_cli
      - run: KEYBAY_SKIP_DART_INSTALL=1 ./tool/test_cli.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-regression-minimum-sdk
          path: build/regression/*/report.json
          if-no-files-found: warn
          retention-days: 14

  integration-macos:
    needs: provider-impact
    if: needs.provider-impact.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      - run: dart pub get --enforce-lockfile
      # A disposable Keychain also exercises locked record operations. The
      # public facade separately resolves the runner's genuine account home.
      - run: ./tool/test_e2e.sh macos
      - run: KEYBAY_INTEGRATION=1 dart test test/v2_macos_unentitled_integration_test.dart --name 'public Keybay facade'
        working-directory: packages/keybay
      - run: ./tool/test_cli_storage.sh
      # Package, verify, extract, and execute the exact README onboarding loop
      # against the fixed-appId product. GitHub-hosted runners are disposable
      # and start without a Keybay store.
      - run: KEYBAY_QUICKSTART=1 ./tool/test_cli_quickstart.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-regression-macos
          path: build/regression/*/report.json
          if-no-files-found: warn
          retention-days: 14

  integration-linux:
    needs: provider-impact
    if: needs.provider-impact.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      - run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus libglib2.0-bin
      - run: dart pub get --enforce-lockfile
      - run: ./tool/test_e2e.sh linux
      # Real Secret Service round-trip: a throwaway D-Bus session with a fresh
      # gnome-keyring unlocked by a known password (secrets component only).
      # Recipe verified locally against real gnome-keyring in a Docker container.
      # ~/.local/share is intentionally NOT pre-created — the resolver e2e test
      # exercises the clean-account path where the library creates it (0700).
      - run: |
          # The quoted variables expand inside the deliberately separate shell.
          # shellcheck disable=SC2016
          KEYBAY_BENCHMARK_OUTPUT="$RUNNER_TEMP/cli-benchmark-linux.json" \
          dbus-run-session -- bash -c '
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            eval "$(printf itest | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            ./tool/test_cli_storage.sh
            KEYBAY_QUICKSTART=1 ./tool/test_cli_quickstart.sh
            KEYBAY_BENCHMARK=1 KEYBAY_BENCHMARK_ITERATIONS=100 \
              ./tool/benchmark_cli.sh
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-benchmark-linux-x64
          path: ${{ runner.temp }}/cli-benchmark-linux.json
          if-no-files-found: warn
          retention-days: 30
      # The CLI has its own locked-store contract: exit 69, actionable text,
      # and no secret in diagnostics. Keep it in a separate disposable session
      # because this test also leaves the login collection locked.
      - run: |
          # The quoted variables expand inside the deliberately separate shell.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            eval "$(printf itest | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            KEYBAY_LOCKED_TEST=1 ./tool/test_cli_locked_storage.sh
          '
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-regression-linux
          path: build/regression/*/report.json
          if-no-files-found: warn
          retention-days: 14

  integration-flatpak:
    needs: provider-impact
    if: needs.provider-impact.outputs.linux == 'true'
    # Exercise real Flatpak confinement and portal caller identity. The
    # ordinary Secret Service lane does not establish these properties.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      - run: sudo apt-get update && sudo apt-get install -y flatpak xdg-desktop-portal gnome-keyring dbus libglib2.0-bin python3 gcr xvfb xdotool
      - run: dart pub get --enforce-lockfile
      - name: qualify two installed Flatpak application IDs
        env:
          KEYBAY_FLATPAK_REPORT: ${{ runner.temp }}/flatpak-qualification.json
        run: ./tool/test_e2e.sh flatpak
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-qualification-linux-x64
          path: ${{ runner.temp }}/flatpak-qualification.json
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-regression-flatpak
          path: build/regression/*/report.json
          if-no-files-found: warn
          retention-days: 14

  # Genuine mobile platform APIs on disposable virtual devices. These are
  # Continuous integration checks, not physical-device qualification and do
  # not issue physical qualification reports.
  integration-android:
    needs: provider-impact
    if: needs.provider-impact.outputs.android == 'true'
    name: integration-android (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # The emulator can stall the same way the simulator does. Boot is slower
    # here, but healthy runs still land at five to six minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install exact Flutter SDK
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth=1 origin refs/tags/3.44.4:refs/tags/3.44.4
          git -C "$flutter_root" checkout --detach refs/tags/3.44.4
          test "$(git -C "$flutter_root" rev-parse HEAD)" = ad70ec4617166f1c38e5d2bfd388af71fda14f06
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: example_flutter
      - name: enable KVM for the Android emulator
        run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: ./tool/test_e2e.sh android
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-regression-android-${{ matrix.api-level }}
          path: build/regression/*/report.json
          if-no-files-found: warn
          retention-days: 14

  integration-ios:
    needs: provider-impact
    if: needs.provider-impact.outputs.ios == 'true'
    # Keep the simulator gate on the stable Xcode 16 line used by the supported
    # product lane rather than allowing macos-latest to move underneath it.
    runs-on: macos-15
    # The native XCTest bridge bounds Dart result collection to two minutes;
    # retain a wider job-level bound for simulator boot or Xcode build stalls.
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: verify exact Xcode toolchain
        run: test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"
      - name: install exact Flutter SDK
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth=1 origin refs/tags/3.44.4:refs/tags/3.44.4
          git -C "$flutter_root" checkout --detach refs/tags/3.44.4
          test "$(git -C "$flutter_root" rev-parse HEAD)" = ad70ec4617166f1c38e5d2bfd388af71fda14f06
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: example_flutter
      - run: ./tool/test_e2e.sh ios
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xctest-diagnostics
          path: |
            ${{ runner.temp }}/keybay-ios-*.xcresult
            ${{ runner.temp }}/keybay-ios-*.log
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-regression-ios
          path: build/regression/*/report.json
          if-no-files-found: warn
          retention-days: 14

  # One stable branch-protection context for the conditional provider matrix.
  # GitHub skips a matrix before expansion when its job-level `if` is false,
  # so requiring the individual provider job names makes an unrelated change
  # impossible to merge. This gate is always materialized for PR/manual runs:
  # every selected provider must pass and every unselected provider must have
  # been skipped. Keep the expensive provider jobs conditional above.
  provider-gate:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs:
      - provider-impact
      - integration-macos
      - integration-linux
      - integration-flatpak
      - integration-android
      - integration-ios
    runs-on: ubuntu-latest
    env:
      IMPACT_RESULT: ${{ needs.provider-impact.result }}
      IMPACT_REASON: ${{ needs.provider-impact.outputs.reason }}
      MACOS_REQUIRED: ${{ needs.provider-impact.outputs.macos }}
      MACOS_RESULT: ${{ needs.integration-macos.result }}
      LINUX_REQUIRED: ${{ needs.provider-impact.outputs.linux }}
      LINUX_RESULT: ${{ needs.integration-linux.result }}
      FLATPAK_RESULT: ${{ needs.integration-flatpak.result }}
      ANDROID_REQUIRED: ${{ needs.provider-impact.outputs.android }}
      ANDROID_RESULT: ${{ needs.integration-android.result }}
      IOS_REQUIRED: ${{ needs.provider-impact.outputs.ios }}
      IOS_RESULT: ${{ needs.integration-ios.result }}
    steps:
      - name: require selected providers and validate skips
        run: |
          set -euo pipefail
          if [[ "$IMPACT_RESULT" != success ]]; then
            echo "::error::provider-impact did not succeed: $IMPACT_RESULT"
            exit 1
          fi

          check_provider() {
            provider="$1"
            required="$2"
            result="$3"
            case "$required:$result" in
              true:success|false:skipped)
                echo "$provider: required=$required result=$result"
                ;;
              *)
                echo "::error::$provider: required=$required result=$result"
                return 1
                ;;
            esac
          }

          echo "provider-impact: $IMPACT_REASON"
          check_provider macos "$MACOS_REQUIRED" "$MACOS_RESULT"
          check_provider linux "$LINUX_REQUIRED" "$LINUX_RESULT"
          check_provider flatpak "$LINUX_REQUIRED" "$FLATPAK_RESULT"
          check_provider android "$ANDROID_REQUIRED" "$ANDROID_RESULT"
          check_provider ios "$IOS_REQUIRED" "$IOS_RESULT"

  site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: site/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec ruby tool/build_site.rb

  # Bounded V2 reader mutations, including independent frame authentication.
  # Every PR runs 200 deterministic cases; this weekly lane runs 20,000 with
  # a fresh seed. Failures report the seed, case index and mutation class.
  # Preserve regressions in the V2 adversarial tests before fixing them.
  fuzz-canary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      - run: dart pub get --enforce-lockfile
      - name: authenticated V2 reader canary (fresh seed)
        working-directory: packages/keybay
        run: |
          seed="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          echo "KEYBAY_FUZZ_SEED=$seed"
          KEYBAY_FUZZ_ITERATIONS=20000 KEYBAY_FUZZ_SEED="$seed" \
            dart test test/v2_fuzz_canary_test.dart
