name: keybay_demo
description: >-
  Dogfooding app for the Keybay SDK: save, read and protect key/value secrets
  on real iOS, Android and macOS devices.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  keybay:
    path: ../../packages/keybay

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
